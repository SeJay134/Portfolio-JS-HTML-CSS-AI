name: Refresh NSFW image-safety lockfile (temporary)
on:
  push:
    branches: [feature/block-adult-images-photo-compressor]
    paths: [package.json]
permissions:
  contents: write
jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve pinned image-safety dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lockfile to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: lock local image-safety dependencies"
          git push origin "HEAD:feature/block-adult-images-photo-compressor"
