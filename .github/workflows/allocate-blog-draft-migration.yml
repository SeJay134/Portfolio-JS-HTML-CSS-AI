name: Allocate local draft migration
on:
  push:
    branches: [feat/blog-draft-foundation]
    paths: ['.github/workflows/allocate-blog-draft-migration.yml']
permissions:
  contents: read
jobs:
  allocate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.4.0
      - name: Generate local migration filename only
        run: |
          supabase --version
          supabase migration new --help
          supabase migration new blog_draft_foundation
          ls supabase/migrations/*_blog_draft_foundation.sql
