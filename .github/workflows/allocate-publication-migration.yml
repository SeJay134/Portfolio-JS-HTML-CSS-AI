name: Allocate local publication migration
on:
  push:
    branches: [feat/blog-publication-foundation]
    paths: ['.github/workflows/allocate-publication-migration.yml']
permissions:
  contents: read
jobs:
  allocate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.4.0
      - run: |
          supabase migration new blog_publication_foundation
          ls supabase/migrations/*_blog_publication_foundation.sql
