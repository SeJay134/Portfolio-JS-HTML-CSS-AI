name: Auth lockfile update (temporary)
on:
  push:
    branches:
      - feat/google-supabase-auth
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated npm lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(auth): synchronize Supabase npm lockfile"
          git push origin HEAD:feat/google-supabase-auth
