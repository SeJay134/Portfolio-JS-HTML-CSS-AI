name: Resolve security lockfile
on:
  push:
    branches: [fix/dependency-security-hardening]
permissions:
  contents: read
jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
      - name: Resolve pinned patched versions without lifecycle scripts
        run: |
          cp package-lock.json /tmp/original-lock.json
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts vite@8.3.8 vitest@5.1.2 typescript-eslint@8.74.0
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=low
      - name: Export lockfile changes for review
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const old = JSON.parse(fs.readFileSync('/tmp/original-lock.json','utf8'));
          const next = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('package.json','utf8'));
          console.log('SEC_MANIFEST '+JSON.stringify(manifest));
          for (const [key, value] of Object.entries(next.packages)) {
            if (JSON.stringify(old.packages[key]) !== JSON.stringify(value)) console.log('SEC_ENTRY '+JSON.stringify([key,value]));
          }
          for (const key of Object.keys(old.packages)) {
            if (!(key in next.packages)) console.log('SEC_REMOVE '+JSON.stringify(key));
          }
          console.log('SEC_KEYS '+JSON.stringify(Object.keys(next.packages)));
          console.log('SEC_LOCK_HASH '+crypto.createHash('sha256').update(JSON.stringify(next)).digest('hex'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-security-lock
          path: |
            package.json
            package-lock.json
