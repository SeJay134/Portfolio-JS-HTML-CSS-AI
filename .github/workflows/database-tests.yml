name: Database security tests
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'server/studio_media/**'
      - 'requirements-studio-media.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/oauth-staging.py'
      - '.github/workflows/database-tests.yml'
  push:
    paths:
      - 'supabase/**'
      - 'server/studio_media/**'
      - 'requirements-studio-media.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/oauth-staging.py'
      - '.github/workflows/database-tests.yml'
permissions:
  contents: read
jobs:
  database-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.4.0
      - run: supabase db start
      - run: supabase test db --local
      - run: supabase db lint --local --level error --fail-on error
      - if: always()
        run: supabase stop --no-backup

  data-api-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-studio-media.txt
      - name: Start disposable local API stack
        run: supabase start
      - name: Exercise real local Data API with synthetic fixtures
        run: PYTHONPATH="$PWD" python supabase/tests/api/blog_security.py
      - if: always()
        run: supabase stop --no-backup

  oauth-staging-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.4.0
      - name: Verify isolated OAuth configuration with dummy credentials
        run: python3 scripts/oauth-staging.py --smoke
