name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Report resolved lockfile digest
        run: node -e "console.log(require('node:crypto').createHash('sha256').update(JSON.stringify(require('./package-lock.json'))).digest('hex'))"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node --test tests/integration/frontend/*.test.mjs
      - run: npm run build
  local-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-local-api-dev.txt
      - run: pip install -r requirements-local-api-dev.txt
      - run: python -m pytest -q tests/integration/backend tests/pr19/test_runner.py tests/pr16/test_evaluator.py tests/pr16/test_quality_runner.py tests/pr16/test_retrieval_probe.py
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke -- --project=chromium
      - run: npm run test:chat-dev
      - run: PR16_CHAT_DEV_PORT=5151 npm run test:chat-dev
      - run: VITE_ENABLE_PUBLIC_CHAT_UI=true npm run build
      - run: npm run test:chat-hydration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-report
          path: |
            playwright-report/
            test-results/
  branch-regression:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-regression-report
          path: |
            playwright-report/
            test-results/
  browser-regression:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:regression
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-report
          path: |
            playwright-report/
            test-results/

  auth-gate:
    runs-on: ubuntu-24.04
    env:
      VITE_ENABLE_GOOGLE_AUTH: "true"
      VITE_SUPABASE_URL: https://mock.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.auth.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: auth-gate-test-report
          path: |
            playwright-report/
            test-results/

  live-blog:
    runs-on: ubuntu-24.04
    env:
      VITE_ENABLE_LIVE_BLOG: "true"
      VITE_ENABLE_GOOGLE_AUTH: "false"
      VITE_SUPABASE_URL: https://mock.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.live-blog.config.ts

  windows-dependencies:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  blog-studio:
    runs-on: ubuntu-24.04
    env:
      VITE_ENABLE_GOOGLE_AUTH: "true"
      VITE_ENABLE_BLOG_ADMIN: "true"
      VITE_ENABLE_BLOG_EDITOR: "true"
      VITE_SUPABASE_URL: https://mock.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.blog-studio.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: blog-studio-report
          path: |
            playwright-report/
            test-results/

  blog-draft-persistence:
    runs-on: ubuntu-24.04
    env:
      VITE_ENABLE_GOOGLE_AUTH: "true"
      VITE_ENABLE_BLOG_ADMIN: "true"
      VITE_ENABLE_BLOG_EDITOR: "true"
      VITE_ENABLE_BLOG_DRAFTS: "true"
      VITE_SUPABASE_URL: https://mock.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.blog-drafts.config.ts

  blog-photo-preparation:
    runs-on: ubuntu-24.04
    env:
      VITE_ENABLE_GOOGLE_AUTH: "true"
      VITE_ENABLE_BLOG_ADMIN: "true"
      VITE_ENABLE_BLOG_EDITOR: "true"
      VITE_ENABLE_BLOG_PHOTOS: "true"
      VITE_SUPABASE_URL: https://mock.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.blog-photos.config.ts
